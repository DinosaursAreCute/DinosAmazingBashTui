$schema: "http://json-schema.org/draft-07/schema#"
title: Bash TUI Configuration
description: Declarative layout and widget configuration for the Bash TUI framework.
type: object
required:
  - layout
properties:
  version:
    type: [string, number]
    description: Schema version indicator.
  imports:
    type: array
    description: List of external bash scripts to source for logic and callbacks.
    items:
      type: string
  layout:
    $ref: "#/definitions/layoutNode"
    description: The root layout node (pane, hsplit, or vsplit).

definitions:
  styleProps:
    type: object
    description: Defines color and typography modifiers for a rendered element.
    additionalProperties: false
    properties:
      fg:
        type: string
        description: "Foreground color: base (e.g., 'red'), 256-color (e.g., '256:42'), or hex (e.g., '#FF5500')."
      bg:
        type: string
        description: "Background color: base (e.g., 'black'), 256-color, or hex."
      modifiers:
        type: array
        description: Text attributes.
        items:
          type: string
          enum: [bold, dim, italic, underline, reverse, blink, hidden, strike]

  layoutNode:
    oneOf:
      - $ref: "#/definitions/splitNode"
      - $ref: "#/definitions/paneNode"

  splitNode:
    type: object
    required: [type, id, children]
    properties:
      type:
        type: string
        enum: [hsplit, vsplit]
      id:
        type: string
      weight:
        type: integer
        minimum: 1
      children:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/layoutNode"

  paneNode:
    type: object
    required: [type, id]
    properties:
      type:
        type: string
        const: pane
      id:
        type: string
      weight:
        type: integer
        minimum: 1
      title:
        type: string
      border:
        type: string
        enum: [single, double, heavy, none]
      title_style:
        $ref: "#/definitions/styleProps"
      border_style:
        $ref: "#/definitions/styleProps"
      widgets:
        type: array
        items:
          $ref: "#/definitions/widget"

  widget:
    oneOf:
      - $ref: "#/definitions/labelWidget"
      - $ref: "#/definitions/buttonWidget"
      - $ref: "#/definitions/inputWidget"

  baseWidget:
    type: object
    required: [id, row]
    properties:
      id:
        type: string
      row:
        type: integer
        minimum: 0
      style:
        $ref: "#/definitions/styleProps"

  labelWidget:
    type: object
    required: [type, text]
    allOf:
      - $ref: "#/definitions/baseWidget"
    properties:
      type:
        const: label
      text:
        type: string

  buttonWidget:
    type: object
    required: [type, text, action]
    allOf:
      - $ref: "#/definitions/baseWidget"
    properties:
      type:
        const: button
      text:
        type: string
      action:
        type: string
      focus_style:
        $ref: "#/definitions/styleProps"

  inputWidget:
    type: object
    required: [type, label, placeholder]
    allOf:
      - $ref: "#/definitions/baseWidget"
    properties:
      type:
        const: input
      label:
        type: string
      placeholder:
        type: string
      action:
        type: string
      focus_style:
        $ref: "#/definitions/styleProps"