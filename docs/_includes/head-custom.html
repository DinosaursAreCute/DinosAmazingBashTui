<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("pre > code.language-mermaid").forEach(function (c) {
    var d = document.createElement("div");
    d.className = "mermaid";
    d.textContent = c.textContent;
    c.parentElement.replaceWith(d);
  });
  mermaid.initialize({ startOnLoad: true, theme: (document.documentElement.dataset.theme==="light"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: light)").matches))?"default":"dark" });
</script>
