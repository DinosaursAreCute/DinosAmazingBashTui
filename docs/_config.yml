title: D.A.B.T - Bash TUI Framework
description: Pure bash TUI framework. Build multi-page terminal UIs with XML markup, CSS-like themes, mouse support and live process panes. No Python, Node or ncurses.
url: https://dinosaursarecute.github.io
baseurl: /DinosAmazingBashTui
theme: jekyll-theme-primer
logo: /assets/logo.png
lang: en
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: true
github:
  repository_url: https://github.com/DinosaursAreCute/DinosAmazingBashTui
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - node_modules/
defaults:
  - scope:
      path: ""
    values:
      # GitHub's *native* Jekyll build applies this implicitly for a themed
      # site; a plain `jekyll build` (our custom Actions build) does not, so
      # it must be explicit or every page renders with no layout at all.
      layout: default
      description: Pure bash TUI framework documentation - tutorials, markup guide, widgets, plugins and API reference.
