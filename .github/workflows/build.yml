# Builds and signs the DABT framework package (dabt-<version>-<build>.dapk) with the repository's own `dabt build`.
# Pipeline: test (bats) -> package -> install-update (install + update DABT from the artifact) -> release (tags only).
#   push to main     -> dev build, kept as a workflow artifact (never published)
#   tag v1.2.3       -> signed build + published GitHub release (full release, no manual step)
#   tag v1.2.3-rc.1  -> signed build + PRE-RELEASE
#   manual run       -> dev build artifact
# Build number: github.run_number (GITHUB_RUN_NUMBER) is picked up automatically by dabt. It grows with every run of this workflow file,
# is identical on a re-run, and never repeats, so 0.0.7-57 is always newer than 0.0.7-56. If this file is ever renamed the counter restarts:
# set build_offset in dabt.pkg to the last number used.
#
# Repository settings (set with the GitHub CLI, see tools/ci_setup.sh):
#   secret   DABT_SIGN_KEY               the private Ed25519 signing key
#   variable DABT_SIGNER_FINGERPRINT     SHA256:... of that key; the build fails if the package is signed by anything else
name: Build DABT package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats parallel unzip zip
      - name: DABT test suite
        run: bats --jobs "$(nproc)" --no-parallelize-within-files tests/ tests/dapk/     # each test runs in its own tmp dir

  package:
    needs: test
    runs-on: ubuntu-latest
    env:
      DABT_SIGN_KEY: ${{ secrets.DABT_SIGN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: dabt's git-count fallback and the release notes' compare link need it

      - name: Check the signing setup
        run: |
          [ -n "$DABT_SIGN_KEY" ] || { echo "::error::secret DABT_SIGN_KEY is not set (run tools/ci_setup.sh)"; exit 1; }
          [ -n "${{ vars.DABT_SIGNER_FINGERPRINT }}" ] || { echo "::error::variable DABT_SIGNER_FINGERPRINT is not set (run tools/ci_setup.sh)"; exit 1; }

      - name: Build (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash bin/dabt build

      - name: Build (dev)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bash bin/dabt build --suffix dev

      - name: Verify the package
        id: pkg
        run: |
          pkg="$(ls -t dist/dabt-*.dapk | head -n1)"
          fp="$(bash bin/dabt pkg info "$pkg" | awk '$1 == "signer" {print $2; exit}')"
          if [ -z "$fp" ]; then
            echo "::group::debug: package info and MANIFEST"
            ls -l dist/; bash bin/dabt pkg info "$pkg" 2>&1 | head -20; tar -tzf "$pkg" | head -5
            tar -xzOf "$pkg" --wildcards '*/MANIFEST' 2>&1 | head -15
            echo "::endgroup::"
          fi
          [ "$fp" = "${{ vars.DABT_SIGNER_FINGERPRINT }}" ] || { echo "::error::signed by $fp, expected ${{ vars.DABT_SIGNER_FINGERPRINT }}"; exit 1; }
          bash bin/dabt pkg verify "$pkg" --trust-key "$fp"
          echo "name=$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          { echo "### ${pkg##*/}"; echo; echo "- build number: \`${GITHUB_RUN_NUMBER}\`"; echo "- signer: \`$fp\`"; echo "- size: $(wc -c < "$pkg") bytes"; } >> "$GITHUB_STEP_SUMMARY"
        env:
          TUI_HOME: ${{ runner.temp }}/dabt-home          # keep the runner's trust store out of the way

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/
          if-no-files-found: error


  # installs DABT from the built package, then updates an older install to it (tools/ci_integration.sh)
  install-update:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dabt-*.dapk
          path: dist/
          merge-multiple: true
      - name: Baseline = the previous release (falls back to the package with VERSION 0.0.0)
        id: base
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -n "$tag" ]; then mkdir -p "$RUNNER_TEMP/baseline" && git archive "$tag" | tar -x -C "$RUNNER_TEMP/baseline"; echo "dir=$RUNNER_TEMP/baseline" >> "$GITHUB_OUTPUT"; echo "baseline: $tag"; else echo "dir=" >> "$GITHUB_OUTPUT"; echo "no earlier release tag: using the synthetic baseline"; fi
      - name: Install and update from the package
        run: bash tools/ci_integration.sh "$(ls -t dist/dabt-*.dapk | head -n1)" "${{ steps.base.outputs.dir }}"

  release:
    needs: install-update
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dabt-*.dapk
          path: dist/
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # v1.2.3 is published as a full release right away; v1.2.3-rc.1 (a suffix) becomes a pre-release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) bash bin/dabt pkg publish ;;
            *)   bash bin/dabt pkg publish --release ;;
          esac
